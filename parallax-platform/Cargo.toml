[package]
name = "parallax-platform"
version = "0.1.0"
edition = "2021"

[dependencies]
topcoat = { version = "0.6", features = ["tailwind", "htmx"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }

[build-dependencies]
topcoat = { version = "0.6", features = ["tailwind", "htmx"] }
